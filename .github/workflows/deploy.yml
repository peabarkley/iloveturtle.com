name: 部署到GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 检查必要文件
        run: |
          echo "检查文件是否存在："
          ls -la
          echo "index.html 是否存在？"
          test -f index.html && echo "✅ index.html 存在" || echo "❌ index.html 不存在！"
      
      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
  
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
