      - name: 生成文章列表
        run: |
          cd scripts
          python generate_article_list.py
          python update_homepage.py
      
      - name: 提交更改
        run: |
          git config user.name "爱龟谷机器人"
          git config user.email "bot@iloveturtle.com"
          git add zh/articles.html index.html
          git diff --quiet && git diff --staged --quiet || git commit -m "🤖 更新文章列表 $(date +'%Y-%m-%d %H:%M')"
          git push
