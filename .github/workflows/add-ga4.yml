name: Batch Add GA4 Code

on:
  workflow_dispatch: # 允许你手动点击触发

jobs:
  run-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允许机器人修改并提交文件

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run script to add GA4
        run: python scripts/add_ga4.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff-index --quiet HEAD || (git commit -m "Auto inject GA4 tracking code to all pages" && git push)
