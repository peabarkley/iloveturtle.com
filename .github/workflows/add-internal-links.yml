name: Auto Add Internal Links

on:
  workflow_dispatch: # 允许你手动点击按钮触发

jobs:
  run-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 给机器人修改并提交文件的权限

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run internal link script
        run: python scripts/add_internal_links.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff-index --quiet HEAD || (git commit -m "Auto add internal links" && git push)
